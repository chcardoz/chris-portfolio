"$schema" = "https://conductor.build/schemas/settings.repo.schema.json"

[scripts]
setup = "bun install --frozen-lockfile && if [ -n \"$CONDUCTOR_ROOT_PATH\" ] && [ \"$CONDUCTOR_ROOT_PATH\" != \"$PWD\" ] && [ -f \"$CONDUCTOR_ROOT_PATH/.env\" ]; then ln -sf \"$CONDUCTOR_ROOT_PATH/.env\" .env; elif [ ! -f .env ]; then echo 'No .env found - copy .env.example to .env and fill in values'; fi"
run = "bun run dev -- -p $CONDUCTOR_PORT"
archive = "rm -rf node_modules .next"
run_mode = "concurrent"
